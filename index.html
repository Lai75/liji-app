<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#131417" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<title>黎记 · 待办 & 记账</title>
<script src="./chart.umd.min.js" defer></script>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app">
  <aside id="sidenav">
    <div class="brand serif">黎记</div>
    <div class="tagline">待办 · 记账 · 一目了然</div>
    <button class="nav-item" data-tab="tasks">📋&nbsp;&nbsp;待办清单</button>
    <button class="nav-item" data-tab="habits">🔥&nbsp;&nbsp;习惯打卡</button>
    <button class="nav-item" data-tab="ledger">💰&nbsp;&nbsp;记账本</button>
    <button class="nav-item" data-tab="accounts">💳&nbsp;&nbsp;账户</button>
    <button class="nav-item" data-tab="overview">📊&nbsp;&nbsp;总览</button>
  </aside>

  <main>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-habits"></section>
    <section class="view" id="view-ledger"></section>
    <section class="view" id="view-accounts"></section>
    <section class="view" id="view-overview"></section>
  </main>
</div>

<button id="installBtn" title="安装到桌面/主屏幕" hidden>⬇️</button>
<button id="themeBtn" title="切换深浅色">🌙</button>

<nav id="mobilenav">
  <button class="nav-item" data-tab="tasks">📋<span>待办</span></button>
  <button class="nav-item" data-tab="habits">🔥<span>习惯</span></button>
  <button class="nav-item" id="moneyNavBtn" data-tab="ledger">💰<span>记账</span></button>
  <button class="nav-item" data-tab="overview">📊<span>总览</span></button>
</nav>

<script src="./storage.js" defer></script>
<script src="./sync.js" defer></script>
<script src="./tasks.js" defer></script>
<script src="./habits.js" defer></script>
<script src="./ledger.js" defer></script>
<script src="./gadgets.js" defer></script>
<script src="./accounts.js" defer></script>
<script src="./overview.js" defer></script>
<script src="./main.js" defer></script>
</body>
</html>
