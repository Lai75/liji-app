<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#131417" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<title>黎记 · 待办 & 记账</title>
<script src="./chart.umd.min.js"></script>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app">
  <aside id="sidenav">
    <div class="brand serif">黎记</div>
    <div class="tagline">待办 · 记账 · 一目了然</div>
    <button class="nav-item" data-tab="tasks">📋&nbsp;&nbsp;待办清单</button>
    <button class="nav-item" data-tab="habits">🔥&nbsp;&nbsp;习惯打卡</button>
    <button class="nav-item" data-tab="ledger">💰&nbsp;&nbsp;记账本</button>
    <button class="nav-item" data-tab="gadgets">📱&nbsp;&nbsp;数码库</button>
    <button class="nav-item" data-tab="overview">📊&nbsp;&nbsp;总览</button>
  </aside>

  <main>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-habits"></section>
    <section class="view" id="view-ledger"></section>
    <section class="view" id="view-gadgets"></section>
    <section class="view" id="view-overview"></section>
  </main>
</div>

<button id="themeBtn" title="切换深浅色">🌙</button>

<nav id="mobilenav">
  <button class="nav-item" data-tab="tasks">📋<span>待办</span></button>
  <button class="nav-item" data-tab="habits">🔥<span>习惯</span></button>
  <button class="nav-item" id="moneyNavBtn" data-tab="ledger">💰<span>记账</span></button>
  <button class="nav-item" data-tab="overview">📊<span>总览</span></button>
</nav>

<script src="./storage.js"></script>
<script src="./sync.js"></script>
<script src="./tasks.js"></script>
<script src="./habits.js"></script>
<script src="./ledger.js"></script>
<script src="./gadgets.js"></script>
<script src="./overview.js"></script>
<script>
/* ---------------- 启动胶水:主题、导航、init(依赖上面全部文件) ---------------- */
/* ---------------- theme ---------------- */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  document.getElementById('themeBtn').textContent = t==='dark'?'☀️':'🌙';
  document.querySelector('meta[name=theme-color]').content = t==='dark'?'#131417':'#F7F4EC';
  if(activeTab==='overview') renderOverview();
}
applyTheme(localStorage.getItem('shiji-theme') || 'dark');
document.getElementById('themeBtn').addEventListener('click',()=>{
  const next = document.documentElement.dataset.theme==='dark'?'light':'dark';
  localStorage.setItem('shiji-theme', next);
  applyTheme(next);
});

/* ---------------- nav ---------------- */
// 手机底栏「记账/数码库」共用一个槽位:在其中一页时再点一下切到另一页(data-tab 动态翻转实现)
let lastMoneyTab = 'ledger';
function setTab(tab){
  activeTab = tab;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const money = document.getElementById('moneyNavBtn');
  const onMoney = tab==='ledger' || tab==='gadgets';
  if(onMoney) lastMoneyTab = tab;
  const shown = onMoney ? tab : lastMoneyTab;
  money.dataset.tab = tab==='ledger' ? 'gadgets' : tab==='gadgets' ? 'ledger' : lastMoneyTab;
  money.innerHTML = shown==='ledger' ? `💰<span>记账${onMoney?' ⇄':''}</span>` : `📱<span>数码库${onMoney?' ⇄':''}</span>`;
  money.classList.toggle('active', onMoney);
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  if(tab==='tasks') renderTasks();
  if(tab==='habits') renderHabits();
  if(tab==='ledger') renderLedger();
  if(tab==='gadgets') renderGadgets();
  if(tab==='overview') renderOverview();
}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

/* ================= INIT ================= */

async function init(){
  await loadAll();
  // 请求持久存储,降低浏览器空间紧张时自动清掉数据的概率
  navigator.storage?.persist?.().catch(()=>{});
  setTab('tasks');
  syncNow(); // 已登录则后台同步,完成后自动刷新
}
init();

// 挂过夜后回到前台,"今天"已变,重渲染当前页(打卡/到期判断才正确);回前台顺便同步
let lastDay = todayStr();
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible') return;
  if(todayStr()!==lastDay){ lastDay = todayStr(); setTab(activeTab); }
  syncNow();
});

// PWA:file:// 打开时 SW 不可用,静默跳过
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
